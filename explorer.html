<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorateur DTW</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">DTW Representation Explorer</a>
  <nav><a href="index.html">Accueil</a></nav>
</header>

<main class="explorer-main">
  <div class="explorer-heading">
    <div><p class="eyebrow">Galerie interactive</p><h1>Explorer les heatmaps</h1><p id="summary">Chargement…</p></div>
    <button id="reset" class="button secondary">Réinitialiser</button>
  </div>

  <section class="filters">
    <label>Recherche<input id="search" type="search" placeholder="Nom du fichier…"></label>
    <label>Modèle<select id="model"><option value="">Tous</option></select></label>
    <label>Token<select id="token"><option value="">Tous</option></select></label>
    <label>Segmentation<select id="segmentation"><option value="">Toutes</option></select></label>
    <label>Couche<select id="layer"><option value="">Toutes</option></select></label>
  </section>

  <section id="compareBar" class="compare-bar" hidden>
    <span id="compareCount"></span>
    <div><button id="compareButton" class="button primary">Comparer</button><button id="clearCompare" class="button secondary">Vider</button></div>
  </section>

  <section id="gallery" class="gallery"></section>
  <div id="empty" class="empty" hidden>Aucune image trouvée.</div>
</main>

<dialog id="viewer" class="modal"><button class="close" id="closeViewer">×</button><img id="viewerImage"><h2 id="viewerTitle"></h2></dialog>
<dialog id="comparison" class="modal"><button class="close" id="closeComparison">×</button><div id="comparisonGrid" class="comparison-grid"></div></dialog>

<script src="app.js"></script>
</body>
</html>
